<!-- Toast Notification -->
<div *ngIf="showToast"
     style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; min-width: 250px;">
  <div class="toast show align-items-center text-bg-primary border-0">
    <div class="d-flex">
      <div class="toast-body">
        {{ toastMessage }}
      </div>
      <button type="button"
              class="btn-close btn-close-white me-2 m-auto"
              (click)="showToast=false">
      </button>
    </div>
  </div>
</div>

<div class="container position-relative" style="z-index:2;">
  <div class="row">
    <div class="col-lg-12 mx-auto py-5">

      <div class="admin-card p-5">
        <div class="d-flex flex-column">
          <h1 class="display-4 fw-bold mb-3"> Welcome {{user.first_name | titlecase}} {{user.last_name | titlecase}} </h1>
        </div>
        <div class="gold-divider mx-auto mb-4"></div>
        <div class="mb-3 row">
          <label class="col-lg-2 col-form-label">Car Name</label>
          <div class="col-lg-5">
            <input type="text" class="form-control-plaintext form-control-custom" [value]="bookingDetails.carName" readonly>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-lg-2 col-form-label">Location</label>
          <div class="col-lg-5">
            <input type="text" class="form-control-plaintext form-control-custom" [value]="bookingDetails.location" readonly>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-lg-2 col-form-label">Date</label>
          <div class="col-lg-4">
            <input type="text" class="form-control-plaintext form-control-custom" [value]="bookingDetails.bookingDate" readonly>
          </div>
          <label class="col-lg-1 col-form-label">Booking ID</label>
          <div class="col-lg-5">
            <input type="text" class="form-control-plaintext form-control-custom" [value]="bookingDetails.bookingId" readonly>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-lg-2 col-form-label">Payment Status</label>
          <div class="col-lg-4">
            <input type="text" class="form-control-plaintext form-control-custom" [value]="bookingDetails.paymentStatus" readonly>
          </div>
        </div>

        <div class="small text-light" *ngIf="isLoading">Loading booking details...</div>
      </div>
    </div>
</div>
</div>
