<div class="login-container">
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-content">
      <div class="brand-logo-main">
        <span class="logo-text"><span class="logo-accent">Drive Supercars</span></span>
        <div class="logo-underline"></div>
      </div>
      <p class="logo-subtitle text-uppercase letter-spacing-2 mt-3">Premium Car Rental</p>
      <p class="hero-description mt-4">Experience luxury and comfort with our premium fleet</p>
    </div>
  </div>

  <!-- Form Section -->
  <div class="form-section">
    <div class="login-card">
      <h2 class="form-title">Welcome Back</h2>
      <p class="form-subtitle">Sign in to continue your journey</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            placeholder="Enter your email"
            [class.is-invalid]="submitted && f['email'].errors"
          />
          <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
            <small *ngIf="f['email'].errors['required']">Email is required</small>
            <small *ngIf="f['email'].errors['email']">Email must be valid</small>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="form-control"
            placeholder="Enter your password"
            [class.is-invalid]="submitted && f['password'].errors"
          />
          <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
            <small *ngIf="f['password'].errors['required']">Password is required</small>
            <small *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</small>
          </div>
        </div>

        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <span *ngIf="loading" class="spinner"></span>
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <p class="text-center signup-link">
        Don't have an account? <a routerLink="/user/registration">Create Account</a>
      </p>
    </div>
  </div>
</div>
